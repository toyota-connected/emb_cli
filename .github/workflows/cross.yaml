name: cross

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/cross.yaml"
      - "lib/src/cross/**"
      - "lib/src/commands/cross_command.dart"
      - "lib/src/commands/matrix_command.dart"
      # The app-bundle job below is the only one that runs these for real.
      - "lib/src/aot/**"
      - "lib/src/bundle/**"
      - "lib/src/engine/**"
      - "lib/src/flutter/**"
      # The init-flatpak job below is the only one that builds what
      # `emb init flatpak` writes.
      - "lib/src/init/**"
      - "lib/src/commands/init_command.dart"
      - "examples/cross/**"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cross.yaml"
      - "lib/src/cross/**"
      - "lib/src/commands/cross_command.dart"
      - "lib/src/commands/matrix_command.dart"
      # The app-bundle job below is the only one that runs these for real.
      - "lib/src/aot/**"
      - "lib/src/bundle/**"
      - "lib/src/engine/**"
      - "lib/src/flutter/**"
      # The init-flatpak job below is the only one that builds what
      # `emb init flatpak` writes.
      - "lib/src/init/**"
      - "lib/src/commands/init_command.dart"
      - "examples/cross/**"
      - "pubspec.yaml"
  workflow_dispatch:
    inputs:
      build:
        description: "Also run real cross builds (L2 — network + privileges)."
        type: boolean
        default: false

jobs:
  # ── Stage 1: render the matrix from the example manifests ────────────────
  # Side-effect free (parse only): one cell per (manifest × target × supported
  # host). Hosts without a GitHub runner (fedora) ride an ubuntu-latest host in
  # a container image — the matrix carries that as `container`.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: "stable"
      # `dart run` triggers packagekit_dart's native build hook (vendored
      # sdbus-cpp), which needs libsystemd's sd-bus + a C/C++ toolchain. We
      # control this runner, so install them rather than let the hook degrade.
      - name: 🔧 Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build
      - run: dart pub get
      - name: 🧮 Render cross matrix
        id: gen
        run: |
          # examples/cross/project is the one .emb/ project. It is named on its
          # own: a directory argument is not searched below its own level.
          dart run emb_cli:emb matrix examples/cross examples/cross/project \
            -o matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
      - name: 📋 Show matrix
        run: cat matrix.json

  # ── Stage 2: validate every cell (the PR gate) ──────────────────────────
  # `--dry-run` resolves the plan with no download / mount / ssh, so each board
  # validates on every host it declares — ubuntu directly, fedora in a
  # container. This promotes the doc's L0/L1 surface from "parses" to "the real
  # CLI plans this board end-to-end on this host".
  validate:
    needs: plan
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # The fedora container is minimal: give setup-dart its extract tools and
      # packagekit_dart's native build hook (vendored sdbus-cpp) a full C/C++
      # toolchain + sd-bus headers so it builds cleanly. The dry-run itself
      # never touches PackageKit, but we control this environment, so the hook
      # should compile rather than degrade.
      - name: 🧱 Bootstrap container (fedora)
        if: ${{ matrix.container != '' }}
        run: >
          dnf -y install git tar xz unzip findutils which
          gcc gcc-c++ cmake ninja-build systemd-devel pkgconf-pkg-config
      # Same for the ubuntu host cells (gcc/g++ are preinstalled there).
      - name: 🔧 Install native build dependencies (host)
        if: ${{ matrix.container == '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: "stable"
      - run: dart pub get
      - name: 🔎 Plan ${{ matrix.id }} / ${{ matrix.target }} on ${{ matrix.host }} (${{ matrix.provider }})
        run: dart run emb_cli:emb cross ${{ matrix.args }} --dry-run

  # ── The --app path, for real (PR gate) ───────────────────────────────────
  # Every cell above stops at the embedder: `emb matrix` passes no `--app`, so
  # the runnable bundle path — engine fetch, AOT, bundle assembly, module
  # build and staging, the bundle audit, the tarball — never ran in CI.
  #
  # This builds examples/cross/app-bundle with the built-in `local` target, so
  # it needs no cross toolchain, no sysroot and no privileges: the embedder is
  # a stand-in that renders nothing, which is what makes the job cheap enough
  # to gate a PR. `--run` then starts that embedder on the bundle; it exits
  # non-zero unless the bundle is complete and the app's native module loads.
  app-bundle:
    name: app bundle (--app, native)
    runs-on: ubuntu-latest
    env:
      FLUTTER_WORKSPACE: ${{ github.workspace }}/.ws
      EXAMPLE: examples/cross/app-bundle
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: "stable"
      - name: 🔧 Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build
      - run: dart pub get
      # The workspace starts empty: the manifest's flutter_version: provisions
      # the SDK, and the engine comes from the published release for it.
      - name: 🏗️ Build, bundle and run
        run: |
          set -o pipefail
          dart run emb_cli:emb -v cross "$EXAMPLE/embedder" --target local \
            --build --app "$EXAMPLE/app" --tar --run | tee build.log
      # A green exit is not evidence on its own: had --run been skipped, or
      # the module dropped from the plan, the build would still pass. Check
      # for what only a complete bundle produces.
      - name: ✅ Assert the bundle really ran
        run: |
          grep -q "module:  hello from the app's native module" build.log || {
            echo "::error::the embedder never loaded the app's native module"
            exit 1; }
          tarball=$(ls "$FLUTTER_WORKSPACE"/.config/flutter_workspace/cross-build-*/runnable.tar.gz)
          listing=$(tar -tzf "$tarball")
          echo "$listing"
          for f in hello-embedder lib/libapp.so lib/libflutter_engine.so \
                   lib/libhello.so data/icudtl.dat; do
            echo "$listing" | grep -qE "(^|/)$f\$" || {
              echo "::error::$f is not in $tarball"; exit 1; }
          done
      # The stand-in embedder proves the files are there. This proves they
      # work together: a headless embedder loads the AOT image into the engine
      # the bundle ships, on the software renderer, and waits for a frame. It
      # links that engine and takes only the header from the engine SDK.
      - name: 🚀 Boot the bundle on its engine
        run: |
          state="$FLUTTER_WORKSPACE/.config/flutter_workspace"
          bundle=$(ls -d "$state"/cross-build-*/runnable)
          header=$(find -L "$state/flutter-engine" -name flutter_embedder.h \
            -path '*release*' -print -quit)
          test -n "$header" || {
            echo "::error::no flutter_embedder.h in the engine SDK"; exit 1; }
          cc -O1 -o boot "$EXAMPLE/boot/boot.c" -I"$(dirname "$header")" \
            -L"$bundle/lib" -lflutter_engine -Wl,-rpath,"$bundle/lib"
          ./boot "$bundle" | tee boot.log
          grep -q '^booted: ' boot.log || {
            echo "::error::the bundle did not boot on its engine"; exit 1; }

  # ── A repo `emb init flatpak` generated builds from nothing ──────────────
  # The unit tests render the templates and resolve the manifest; that proves
  # the output parses. This generates a repo with the emb under test and runs
  # the build command its README gives, from an empty workspace: clone the
  # embedder and the app, install the Flutter SDK, build, package. A build by
  # hand found what no unit test showed (no icon, no description, the wrong
  # binary packaged, a path too long for appstreamcli).
  #
  # The embedder and the app are the ones under examples/cross/app-bundle,
  # served from git repositories made here: `--embedder` and `--app` take a
  # URI, and cross.source cannot name a subdirectory of this repository.
  # ivi-homescreen, the default embedder, is not built: it would tie this job
  # to another repository and to the -dev packages it needs on the runner.
  init-flatpak:
    name: init flatpak (generated repo, cold build)
    runs-on: ubuntu-latest
    env:
      # emb's default, as in emb_cli.yaml's flatpak job. Pinned so a new
      # branch appearing on flathub does not move this job.
      FREEDESKTOP_BRANCH: "25.08"
      APP_ID: com.example.InitCi
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: "stable"
      - name: 🔧 Install build tools, flatpak and flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build \
            flatpak flatpak-builder binutils
      # As the generated workflow installs it, from this checkout: `emb` on
      # PATH, run from the generated repo and not from the package.
      - name: 📦 Install the emb under test
        run: |
          dart pub global activate --source path "$GITHUB_WORKSPACE"
          emb --version
      - name: 🗂️ Serve the example embedder and app from git
        run: |
          for name in embedder app; do
            dir="$RUNNER_TEMP/src/$name"
            mkdir -p "$dir"
            cp -r "examples/cross/app-bundle/$name/." "$dir/"
            git -C "$dir" init -q -b main
            git -C "$dir" add -A
            git -C "$dir" -c user.name=ci -c user.email=ci@example.invalid \
              commit -q -m init
          done
      # runner.temp is not available to the job's env:, so the repo's path is
      # spelled out where it is used.
      - name: 🧬 Generate the repo
        run: |
          REPO="$RUNNER_TEMP/repo"
          emb init flatpak "$REPO" --app-id "$APP_ID" \
            --embedder "file://$RUNNER_TEMP/src/embedder" \
            --embedder-bin hello-embedder \
            --app "file://$RUNNER_TEMP/src/app" \
            --flutter-version 3.47.9 \
            --runtime-version "$FREEDESKTOP_BRANCH"
          cat "$REPO"/*.emb.yaml
      # The install lines the generated README gives, run as written.
      - name: 🗃️ Install the runtime the README names
        working-directory: ${{ runner.temp }}/repo
        run: |
          grep -E '^flatpak (remote-add|install .* org\.freedesktop\.Platform//)' \
            README.md > install.sh
          cat install.sh
          test "$(wc -l < install.sh)" -eq 2 || {
            echo "::error::expected a remote-add and an install in README.md"
            exit 1; }
          sed -i 's/^flatpak install /flatpak install --noninteractive /' \
            install.sh
          sh -e install.sh
      # No FLUTTER_WORKSPACE: the manifest's own workspace: is what a user
      # gets, and it starts empty.
      - name: 🏗️ Build with the command the README gives
        working-directory: ${{ runner.temp }}/repo
        run: |
          cmd=$(grep -m1 -E '^emb cross .* --target local ' README.md)
          test -n "$cmd" || {
            echo "::error::no native build command in README.md"; exit 1; }
          echo "$cmd"
          $cmd
      - name: ✅ Assert the bundle holds what a flatpak needs
        working-directory: ${{ runner.temp }}/repo
        run: |
          bundle=$(ls workspace/.config/flutter_workspace/cross-build-*/dist/"$APP_ID"_stable_*.flatpak)
          flatpak install --user -y --noninteractive "$bundle"
          files="$(flatpak info --user --show-location "$APP_ID")/files"
          (cd "$files" && find . -type f | sort)
          for f in "bin/hello-embedder" \
                   "$APP_ID/hello-embedder" \
                   "$APP_ID/lib/libapp.so" \
                   "$APP_ID/lib/libflutter_engine.so" \
                   "$APP_ID/data/icudtl.dat" \
                   "share/metainfo/$APP_ID.metainfo.xml" \
                   "share/applications/$APP_ID.desktop" \
                   "share/icons/hicolor/256x256/apps/$APP_ID.png"; do
            test -s "$files/$f" || {
              echo "::error::$f is not in the installed flatpak"; exit 1; }
          done
      # The launcher starts the embedder inside the sandbox and hands it the
      # bundle. The stand-in then looks for the app's native module, which a
      # generated manifest does not build, and exits 1: the exit code says
      # nothing here, the lines before it do.
      - name: ✅ Assert the launcher runs the embedder on the bundle
        run: |
          out=$(flatpak run --user "$APP_ID" 2>&1 || true)
          echo "$out"
          for f in data/flutter_assets/AssetManifest.bin data/icudtl.dat \
                   lib/libflutter_engine.so lib/libapp.so; do
            echo "$out" | grep -q "found:   $f" || {
              echo "::error::the embedder did not find $f in the bundle"
              exit 1; }
          done

  # ── Stage 3 (opt-in): real cross build ──────────────────────────────────
  # Manual only (workflow_dispatch + build=true). Per docs/cross_integration.md
  # §13, full builds are L2: they need network and host privileges (image
  # loop-mount, qemu-static apt chroot, SDK install). The `yocto-recipe` /
  # device-rsync providers additionally need state no hosted runner has — point
  # `runs-on` at a self-hosted runner for those, or filter them out of the set.
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build }}
    needs: plan
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FLUTTER_WORKSPACE: ${{ github.workspace }}/.ws
    steps:
      - name: 🧱 Bootstrap container (fedora)
        if: ${{ matrix.container != '' }}
        run: >
          dnf -y install git tar xz unzip findutils which
          gcc gcc-c++ cmake ninja-build systemd-devel pkgconf-pkg-config
      - name: 🔧 Install native build dependencies (host)
        if: ${{ matrix.container == '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: "stable"
      - run: dart pub get
      # The toolchain + sysroot extraction is the expensive, content-addressed
      # artifact — keyed on the cell's sysroot_key so cpu-only variants of one
      # board (rpi4/rpi5 on one image) restore the same cache.
      #
      # `emb matrix` omits sysroot_key when the target's key-affecting paths
      # still hold an unbound ${app_root}, and an omitted matrix property
      # interpolates as the empty string — so without this guard every such cell
      # would key on `cross-<provider>-` and boards with different sysroot images
      # would share one cache entry. Skip the cache instead of poisoning it.
      - name: ♻️ Restore toolchain + sysroot
        if: ${{ matrix.sysroot_key != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ws/.config/flutter_workspace
          key: cross-${{ matrix.provider }}-${{ matrix.sysroot_key }}
      - name: 🧰 Install preflight tools (apt)
        if: ${{ matrix.container == '' && matrix.preflight != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.preflight }} qemu-user-static binfmt-support
      - name: 🧰 Install preflight tools (dnf)
        if: ${{ matrix.container != '' && matrix.preflight != '' }}
        run: dnf -y install ${{ matrix.preflight }} qemu-user-static
      - name: 🏗️ Build ${{ matrix.id }} / ${{ matrix.target }} on ${{ matrix.host }} (${{ matrix.provider }})
        run: dart run emb_cli:emb cross ${{ matrix.args }} --build
