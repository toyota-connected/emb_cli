name: emb_cli

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/emb_cli.yaml"
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "boards/**"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emb_cli.yaml"
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "boards/**"
      - "pubspec.yaml"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1
    with:
      # Port baseline (~46%). The I/O-heavy command/engine/aot/packagekit paths
      # aren't unit-tested yet; raise this as coverage is added.
      min_coverage: 45
      # packagekit_dart's native build hook (run by `dart test`) builds the
      # vendored sdbus-cpp, which needs libsystemd's sd-bus + a C toolchain.
      # Without these the hook degrades silently; install them so the Linux
      # backend actually compiles.
      setup: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libsystemd-dev cmake ninja-build

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: 🔧 Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build

      - name: 📦 Install Dependencies
        run: |
          dart pub get

      - name: 🔎 Verify version
        run: dart run test --run-skipped -t version-verify

  # Per-OS host-provisioner coverage. The reusable `build` job above is the
  # canonical Linux unit/analyze run; this matrix additionally exercises the
  # macOS (brew_dart) and Windows (winget_dart) backends on their own OS and
  # runs the published single-line install end to end on every OS.
  #
  # Windows is pinned to windows-2022: winget_dart's build hook targets the
  # "Visual Studio 17 2022" generator, which windows-latest (now a VS 2026
  # image) does not provide. This matches winget_dart's own CI and lets the
  # native COM bridge actually compile instead of degrading.
  host-backends:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    name: host-backends (${{ matrix.os }})
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      # packagekit_dart's native build hook (run by `dart test` / the activate
      # below) needs libsystemd + a C toolchain on Linux.
      - name: 🔧 Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build

      - name: 📦 Install Dependencies
        run: dart pub get

      # Analyze on the native OS: resolves brew_dart/winget_dart and runs their
      # build hooks (on windows-2022 winget_dart compiles the COM bridge).
      # Formatting is gated OS-independently by the `build` job, not repeated.
      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos --fatal-warnings lib test

      # Host-OS surface only: backend selection + install hints + host info. The
      # rest of the suite is Linux-centric cross-compile tooling (dpkg-deb,
      # debugfs, ELF/usr-merge symlinks, gen_snapshot) covered by the `build`
      # job; it is not meant to run off Linux.
      - name: 🧪 Run Tests
        run: dart test test/src/host test/src/pkg

      # Exercise the published single-line install on each OS: fetch a cached
      # Dart SDK, `dart install` emb from this checkout (running the
      # packagekit_dart/brew_dart/winget_dart native hooks), put it on PATH,
      # and run it.
      - name: 🚀 Single-line install (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval "$(./bootstrap.sh --shellenv)"
          emb --version

      - name: 🚀 Single-line install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-Expression (.\bootstrap.ps1 --shellenv)
          emb --version

  # Exercise the polkit authorization path against a real PackageKit daemon.
  #
  # The rest of the suite mocks the provisioner, so nothing else proves that
  # `--no-interactive` actually reaches the daemon, or that a denial is
  # reported as a denial. GitHub runners are a good fixture for this: the
  # steps run as a non-root user with no logind session, which is exactly the
  # case where polkit cannot prompt.
  authorization:
    name: authorization (real PackageKit)
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: 🔧 Install PackageKit and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            packagekit policykit-1 libsystemd-dev cmake ninja-build
          sudo systemctl start packagekit || true
          pkcon --version

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 📝 Manifest declaring one host package
        run: |
          mkdir -p .ci-configs
          cat > .ci-configs/ci-probe.json <<'JSON'
          {
            "id": "ci-probe",
            "load": true,
            "deps": { "linux": { "ubuntu": ["sl"] } }
          }
          JSON

      # Before authorizing: the daemon must refuse, and emb must say so
      # clearly rather than emitting a raw exception. This is the regression
      # guard for the original bug -- a denial that looked like a crash.
      - name: 🚫 Unauthorized install is refused, with remediation
        run: |
          set +e
          out=$(dart run bin/emb.dart deps --config .ci-configs \
                  --no-interactive 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::expected the unauthorized install to fail"
            exit 1
          fi
          echo "$out" | grep -q "polkit.addRule" || {
            echo "::error::no remediation was printed"; exit 1; }
          echo "$out" | grep -q "does not grant authorization" || {
            echo "::error::non-interactive branch of the hint was not used"
            exit 1; }

      # `doctor` must not report a usable backend while installs are denied.
      - name: 🩺 doctor reports the authorization state
        run: |
          dart run bin/emb.dart doctor --json | tee doctor.json
          python3 - <<'PY'
          import json
          d = json.load(open('doctor.json'))
          auth = d['data']['backend'].get('authorization')
          assert auth is not None, 'doctor did not report authorization'
          assert auth['ready'] is False, f'unexpectedly ready: {auth}'
          print('authorization before rule:', auth)
          PY

      # The rule is the documented fix, and CI uses it so the CI path and the
      # developer path stay identical. On Debian/Ubuntu the admin group is
      # `sudo`, not `wheel`.
      - name: 🔑 Authorize via polkit rule
        run: |
          # GitHub grants the runner passwordless sudo through a sudoers file,
          # not group membership, so it is in neither `sudo` nor `wheel` and
          # the documented rule would not match it. Put it in the group the
          # rule targets, so this job exercises the rule users are actually
          # told to install rather than a CI-only variant. polkit resolves
          # group membership from nss by uid, so this applies immediately
          # without re-login.
          sudo usermod -aG sudo "$(id -un)"
          getent group sudo

          sudo tee /etc/polkit-1/rules.d/49-emb-packagekit.rules >/dev/null <<'RULE'
          polkit.addRule(function(action, subject) {
              var allowed = [
                  "org.freedesktop.packagekit.package-install",
                  "org.freedesktop.packagekit.package-remove",
                  "org.freedesktop.packagekit.system-update"
              ];
              if (allowed.indexOf(action.id) !== -1 &&
                  (subject.isInGroup("wheel") || subject.isInGroup("sudo"))) {
                  return polkit.Result.YES;
              }
          });
          RULE
          sudo chmod 644 /etc/polkit-1/rules.d/49-emb-packagekit.rules
          # polkit watches rules.d, but restarting removes a variable and is
          # cheap. Sessions are not involved here, so nothing is disturbed.
          sudo systemctl restart polkit
          sleep 2

      # Ask polkit directly before blaming emb. If pkcheck reports authorized
      # and the install still fails, the fault is ours; if pkcheck reports
      # otherwise, the rule did not apply and this prints the reason.
      - name: 🔍 Verify polkit accepted the rule
        run: |
          echo "user: $(id)"
          echo "--- rule ---"
          sudo cat /etc/polkit-1/rules.d/49-emb-packagekit.rules
          echo "--- polkit ---"
          systemctl is-active polkit || true
          pkaction --action-id org.freedesktop.packagekit.package-install \
            --verbose || true
          echo "--- pkcheck (no interaction; must not prompt) ---"
          set +e
          pkcheck --action-id org.freedesktop.packagekit.package-install \
            --process $$ </dev/null
          echo "pkcheck exit=$?"
          set -e

      # pkcheck reports authorized above, so if this still fails the two
      # callers are being answered differently. Capture the bus so the
      # CheckAuthorization action id and flags are visible rather than
      # inferred, and dump both daemons' journals on the way out.
      - name: ✅ Authorized install succeeds unattended
        run: |
          log=/tmp/bus.txt
          sudo sh -c "exec busctl monitor --system \
            org.freedesktop.PackageKit > $log 2>&1" &
          sleep 3

          # `usermod` updates /etc/group, but a process only picks up a
          # supplementary group when its credentials are established. The
          # runner agent started before we joined `sudo`, so its children --
          # including this one -- do not carry it, and polkit's rule does not
          # match them. `sg` starts the command with the group applied, which
          # is the equivalent of logging back in.
          set +e
          sg sudo -c "dart run bin/emb.dart deps --config .ci-configs \
            --no-interactive"
          code=$?
          set -e

          sleep 2
          sudo pkill -f "busctl monitor" || true
          sleep 1

          echo "--- CheckAuthorization as PackageKit asked it ---"
          grep -A32 "Member=CheckAuthorization" "$log" | head -44 || true
          echo "--- SetHints as we sent it ---"
          grep -B2 -A12 "Member=SetHints" "$log" | head -24 || true
          echo "--- packagekit journal ---"
          sudo journalctl -u packagekit -n 40 --no-pager || true
          echo "--- polkit journal ---"
          sudo journalctl -u polkit -n 40 --no-pager || true

          if [ "$code" -ne 0 ]; then
            echo "::error::authorized install failed (exit $code)"
            exit 1
          fi
          command -v sl

      - name: 🩺 doctor now reports authorized
        run: |
          sg sudo -c "dart run bin/emb.dart doctor --json" \
            | tee doctor-after.json
          python3 - <<'PY'
          import json
          d = json.load(open('doctor-after.json'))
          auth = d['data']['backend']['authorization']
          assert auth['ready'] is True, f'still not authorized: {auth}'
          print('authorization after rule:', auth)
          PY

      # EMB_NON_INTERACTIVE must be equivalent to the flag, since workflows are
      # expected to set it once at the `env:` level rather than per command.
      - name: 🌍 EMB_NON_INTERACTIVE is equivalent to --no-interactive
        env:
          EMB_NON_INTERACTIVE: "1"
        run: sg sudo -c "dart run bin/emb.dart deps --config .ci-configs"

  # Guard the board library against an installed `emb`.
  #
  # This is the only job that can catch the class of bug it exists for. In a
  # checkout, package_config always resolves and the board library always
  # loads, so the whole suite stays green while `extends:` is broken for every
  # user who installed emb the documented way. The failure is only reachable
  # from a compiled binary, which is what this installs.
  board-library:
    name: board library (installed emb)
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      # `dart install` runs the packagekit_dart build hook.
      - name: 🔧 Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🔨 Install emb as a compiled binary
        run: |
          echo "DART_DATA_HOME=$RUNNER_TEMP/dart" >> "$GITHUB_ENV"
          DART_DATA_HOME="$RUNNER_TEMP/dart" dart install .
          test -x "$RUNNER_TEMP/dart/install/bin/emb"

      - name: 📝 A manifest that extends a shipped board
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          cat > "$RUNNER_TEMP/proj/app.emb.yaml" <<'JSON'
          id: myapp
          cross:
            targets:
              x: {extends: rpi5-trixie}
          JSON

      # Before installing the library: the failure must be self-explanatory.
      # The old message named the board, which read as a typo and sent people
      # to audit a manifest that was fine.
      - name: 🚫 Without the library, the diagnostic names the real cause
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/none
          HOME: ${{ runner.temp }}
        run: |
          set +e
          out=$("$RUNNER_TEMP/dart/install/bin/emb" cross \
                  "$RUNNER_TEMP/proj/app.emb.yaml" --list-targets 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::expected a failure"; exit 1; }
          echo "$out" | grep -q "board library not found" || {
            echo "::error::did not report a missing library"; exit 1; }
          echo "$out" | grep -q "n/a: compiled binary" || {
            echo "::error::did not identify the compiled-binary case"; exit 1; }
          echo "$out" | grep -q "emb boards sync" || {
            echo "::error::did not say how to fix it"; exit 1; }

      - name: 🔑 Install the board library the way bootstrap does
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          python3 -c "import sys; sys.path.insert(0,'tool'); \
            import bootstrap_dart as b; b.install_boards('.', 'linux')"
          test -s "$RUNNER_TEMP/data/emb/boards/.emb-boards-version"

      - name: ✅ The installed binary resolves the board
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
          HOME: ${{ runner.temp }}
        run: |
          EMB="$RUNNER_TEMP/dart/install/bin/emb"
          out=$("$EMB" cross "$RUNNER_TEMP/proj/app.emb.yaml" --list-targets)
          echo "$out"
          echo "$out" | grep -q "arm-gnu" || {
            echo "::error::target did not resolve from the installed library"
            exit 1; }

          list=$("$EMB" boards list)
          echo "$list"
          echo "$list" | grep -q "Source:  installed" || {
            echo "::error::boards list did not report the installed rung"
            exit 1; }
          echo "$list" | grep -q "rpi5-trixie" || {
            echo "::error::boards list did not show the board"; exit 1; }

      # The full installer path, including install()'s local-checkout branch.
      - name: 🥾 bootstrap.sh installs the library end to end
        env:
          DART_DATA_HOME: ${{ runner.temp }}/dart2
          XDG_DATA_HOME: ${{ runner.temp }}/data2
        run: |
          ./bootstrap.sh --install .
          ls "$RUNNER_TEMP/data2/emb/boards"
          test -s "$RUNNER_TEMP/data2/emb/boards/.emb-boards-version"
