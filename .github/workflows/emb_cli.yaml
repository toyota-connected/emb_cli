name: emb_cli

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/emb_cli.yaml"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emb_cli.yaml"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1
    with:
      # Port baseline (~46%). The I/O-heavy command/engine/aot/packagekit paths
      # aren't unit-tested yet; raise this as coverage is added.
      min_coverage: 45

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: 🔧 Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev cmake ninja-build

      - name: 📦 Install Dependencies
        run: |
          dart pub get

      - name: 🔎 Verify version
        run: dart run test --run-skipped -t version-verify

  # macOS / Windows native coverage. The reusable `build` job above runs the
  # Linux (PackageKit) path; this matrix exercises the macOS (brew_dart) and
  # Windows (winget_dart) host-provisioner backends on their own OS — the
  # packages now resolve everywhere, their native build hooks run here, and the
  # backend-selection + install-hint tests assert the per-OS wiring.
  host-backends:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: host-backends (${{ matrix.os }})
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: 📦 Install Dependencies
        run: dart pub get

      # Analyze on the native OS: resolves brew_dart/winget_dart and runs their
      # build hooks (winget_dart compiles the COM bridge on Windows and degrades
      # gracefully when unavailable). Formatting is gated OS-independently by the
      # Linux `build` job, so it is not repeated here.
      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos --fatal-warnings lib test

      # Host-OS surface only: backend selection + install hints + host info. The
      # rest of the suite is Linux-centric cross-compile tooling (dpkg-deb,
      # debugfs, ELF/usr-merge symlinks, gen_snapshot) covered by the `build`
      # job; it is not meant to run off Linux.
      - name: 🧪 Run Tests
        run: dart test test/src/host test/src/pkg

      # Exercise the published single-line install on each native OS: fetch a
      # cached Dart SDK, `pub global activate` emb from this checkout (running
      # the brew_dart/winget_dart native hooks), put it on PATH, and run it.
      - name: 🚀 Single-line install (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          eval "$(./bootstrap.sh --shellenv)"
          emb --version

      - name: 🚀 Single-line install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-Expression (.\bootstrap.ps1 --shellenv)
          emb --version
