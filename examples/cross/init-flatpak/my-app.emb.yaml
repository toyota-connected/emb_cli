# Generated by `emb init flatpak` (emb 0.5.0).
#
# Everything the build needs is named here. The embedder and the app are
# cloned into the workspace below and the Flutter SDK is installed into
# it, so this directory is the whole packaging repo:
#
#   emb cross my-app.emb.yaml --target local --build --flatpak
id: my-app
type: app
workspace: workspace               # relative to this file; git-ignored
flutter_version: '3.47.9'          # a branch or a tag; pin a tag to stop it moving

cross:
  provider: arm-gnu                # required to parse; unused by --target local
  source:                          # the embedder
    uri: https://github.com/toyota-connected/ivi-homescreen.git
    rev: e48ec1c001c6170bd45a5530bf1c32341a55bf76 # v3.0 when generated
  app:                             # the Flutter app; --app <dir> still wins
    uri: https://github.com/me/my_flutter_app.git
    rev: 76b2c6de449ad27de77f53e5a0c1bf748c79b139 # main when generated
  package:
    name: my-app
    version: '0.1.0'
    bin: shell/homescreen          # the embedder, relative to its build dir
    files:
      # AppStream metadata, installed under the flatpak prefix (/app).
      metainfo.xml: /share/metainfo/com.example.MyApp.metainfo.xml
    flatpak:
      app_id: com.example.MyApp
      icon: icon.png               # a placeholder; replace it
      runtime_version: '25.08'
