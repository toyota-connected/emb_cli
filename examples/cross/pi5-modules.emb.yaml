# ivi-homescreen + minimal cmake/meson/cargo modules on Raspberry Pi 5.
#
# Exercises emb's three module build types (cmake, meson, cargo) against the
# arm-gnu cross toolchain. Each module is a dependency-free shared library
# whose only purpose is to trigger the relevant build path in cross_builder.dart.
id: ivi-homescreen-modules
type: app
supported_archs: [arm64]
supported_host_types: [ubuntu, fedora]
flutter_version: stable

cross:
  provider: arm-gnu
  triple: aarch64-none-linux-gnu
  version_policy: pinned
  toolchain_version: 12.3.rel1            # bookworm → gcc 12 / glibc 2.36
  image_url: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-11-19/2024-11-19-raspios-bookworm-arm64-lite.img.xz
  cpu_flags: [-mcpu=cortex-a76]           # pi5; pi4=cortex-a72, piz2=cortex-a53
  source:
    uri: https://github.com/toyota-connected/ivi-homescreen.git
    rev: e48ec1c001c6170bd45a5530bf1c32341a55bf76

  sysroot:
    partition: 2
    dev_packages:
      - libdrm-dev
      - libgbm-dev
      - libinput-dev
      - libxcursor-dev
      - libseat-dev
      - libegl-dev
      - libgles2-mesa-dev
      - libwayland-dev
      - libxkbcommon-dev
      - libudev-dev
      - libsystemd-dev
      - libglib2.0-dev
      - wayland-protocols
      - zlib1g-dev
      - libcurl4-openssl-dev

  augment:
    - pkg: libdisplay-info
      min: "0.2.0"
      url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.2.0.tar.gz
      build: meson
      static: true

  modules:
    - name: rust_lib
      path: modules/rust_lib
      build: cargo
      artifacts: [librust_lib.so]
    - name: cmake_lib
      path: modules/cmake_lib
      build: cmake
      artifacts: [libcmake_lib.so]
    - name: meson_lib
      path: modules/meson_lib
      build: meson
      artifacts: [libmeson_lib.so]

  backends:
    drm-kms-egl:
      BUILD_BACKEND_DRM_KMS_EGL: 'ON'
      BUILD_BACKEND_WAYLAND_EGL: 'OFF'
      BUILD_BACKEND_WAYLAND_VULKAN: 'OFF'
      DISABLE_PLUGINS: 'ON'

  package:
    name: ivi-homescreen-modules
    version: 1.0.0
    maintainer: "emb CI <ci@example.com>"
    description: "IVI Flutter Shell with cmake/meson/cargo modules, cross-built by emb"
    section: utils
    bin: shell/homescreen
    install_dir: /usr/bin
