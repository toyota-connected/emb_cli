# ivi-homescreen on Raspberry Pi 5 (also Pi 4 / Pi Zero 2 W — change cpu_flags).
#
# VALIDATED END-TO-END on this exact config: `emb cross . --build --deb`
# produced an aarch64 ELF `homescreen` (drm-kms-egl backend) and packaged it as
# `ivi-homescreen_1.0.0_arm64.deb`, root-free, against the raspios image below.
#
# Engine SHA pin (handled by EngineArtifacts, not the cross block):
#   13e658725ddaa270601426d1485636157e38c34c
id: ivi-homescreen
type: app
supported_archs: [arm64]
supported_host_types: [ubuntu, fedora]

build:
  app_path: .
  archs: [arm64]
  modes: [release]
  output: bundles

cross:
  provider: arm-gnu
  triple: aarch64-none-linux-gnu
  version_policy: pinned
  toolchain_version: 12.3.rel1            # bookworm → gcc 12 / glibc 2.36
  image_url: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-11-19/2024-11-19-raspios-bookworm-arm64-lite.img.xz
  cpu_flags: [-mcpu=cortex-a76]           # pi5; pi4=cortex-a72, piz2=cortex-a53, generic=[]

  sysroot:
    # rootfs is p2 on a raspios .img (default). dev_packages are resolved to
    # their dependency closure against the image's own apt sources and layered
    # in root-free (dpkg-deb -x) — no apt, no chroot, no sudo.
    partition: 2
    dev_packages:
      - libdrm-dev
      - libgbm-dev
      - libinput-dev
      - libxcursor-dev
      - libseat-dev
      - libegl-dev
      - libgles2-mesa-dev
      - libwayland-dev
      - libxkbcommon-dev
      - libudev-dev
      - libsystemd-dev
      - libglib2.0-dev
      - wayland-protocols
      - zlib1g-dev

  augment:
    # bookworm ships libdisplay-info 0.1.1 (< drm-cxx's 0.2.0 floor), so 0.2.0 is
    # built from source and staged into the sysroot. On a trixie target this
    # disappears (see beagleplay). A Vulkan backend would also stage
    # vulkan-headers (build: cmake) — not exercised by drm-kms-egl below.
    - pkg: libdisplay-info
      min: "0.2.0"
      url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.2.0.tar.gz
      build: meson
      static: true

  backends:
    # One build per entry, into cross-build-<triple>/build-<name>.
    drm-kms-egl:
      BUILD_BACKEND_DRM_KMS_EGL: 'ON'
      BUILD_BACKEND_WAYLAND_EGL: 'OFF'     # default-on; mutually exclusive
      BUILD_BACKEND_WAYLAND_VULKAN: 'OFF'
      DISABLE_PLUGINS: 'ON'

  package:
    # `emb cross . --deb` → cross-build-<triple>/dist/<name>_<version>_arm64.deb.
    # Depends is auto-derived from the binary's DT_NEEDED.
    name: ivi-homescreen
    version: 1.0.0
    maintainer: "Joel Winarske <joel.winarske@gmail.com>"
    description: "IVI Flutter Shell (drm-kms-egl backend), cross-built by emb"
    section: utils
    bin: shell/homescreen                  # relative to each backend build dir
    install_dir: /usr/bin

    # Extra files to ship in the package, as <source>: <dest>. The source is
    # relative to this manifest's directory; the dest is an absolute target
    # path for a .deb/.ipk/.rpm/.tar.gz, or a path under /app for a .flatpak.
    # An entry may set an explicit mode; without one the source mode is kept.
    # files:
    #   assets/app.toml: /etc/ivi-homescreen/app.toml
    #   assets/99-input.rules: /lib/udev/rules.d/99-input.rules
    #   tools/helper: { to: /usr/bin/helper, mode: "0755" }

    # Debian maintainer scripts, <name>: <source relative to this manifest>.
    # Name must be one of preinst/postinst/prerm/postrm; each is staged into
    # the .deb's DEBIAN/ control area (0755) and run by dpkg at that phase
    # (e.g. postinst → udevadm reload / ldconfig). .deb only — flatpak has no
    # host-side post-install hook.
    # scripts:
    #   postinst: debian/postinst.sh
    #   prerm: debian/prerm.sh

    # `emb cross . --build --ipk` → dist/<name>_<version>_<arch>.ipk via
    # opkg-build (opkg/OpenEmbedded targets). Reuses name/version/maintainer/
    # depends/files/scripts above; Depends is explicit (no auto-derivation).
    # Only the opkg arch override lives here — otherwise a CPU-arch default is
    # used (aarch64/arm/...).
    # ipk:
    #   arch: cortexa53                      # opkg MACHINE tuning, if your feed uses it

    # `emb cross . --build --rpm` → dist/<name>-<version>-<release>.<arch>.rpm
    # via rpmbuild. Reuses name/version/depends/files/scripts above (scripts map
    # to %pre/%post/%preun/%postun). License is required; rpm refuses without it.
    # rpm:
    #   license: MIT
    #   release: "1"
    #   group: Applications/System

    # `emb cross . --build --targz` → dist/<name>_<version>_<arch>.tar.gz, a
    # relocatable tree rooted at / (binary + files: at their target paths;
    # unpack with `tar -C / -xzf`). No package manager needed; ignores scripts:.

    # `emb cross . --build --app <dir> --flatpak` → dist/<app_id>_<branch>_<arch>
    # .flatpak. Bundles the whole runnable app (embedder + assets + engine) via
    # flatpak-builder, so it needs --app plus flatpak-builder + the runtime on
    # the build host. Only app_id is required.
    flatpak:
      app_id: com.toyota.ivi.Homescreen    # reverse-DNS; also the /app prefix
      branch: stable
      runtime: org.freedesktop.Platform
      runtime_version: '23.08'
      sdk: org.freedesktop.Sdk
      # icon: assets/icon.png              # relative to this manifest
      finish_args:                         # sandbox permissions
        - --share=ipc
        - --socket=wayland
        - --device=dri
        - --socket=pulseaudio
      categories: [Utility]
