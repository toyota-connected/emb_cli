# ivi-homescreen on Radxa Zero 3W — mirrors scripts/build_radxa_zero3.sh
# Engine SHA pin (EngineArtifacts): 13e658725ddaa270601426d1485636157e38c34c
id: ivi-homescreen
type: app
supported_archs: [arm64]
supported_host_types: [ubuntu, fedora]

build:
  app_path: .
  archs: [arm64]
  modes: [release]
  output: bundles

cross:
  provider: arm-gnu
  triple: aarch64-none-linux-gnu
  version_policy: pinned
  toolchain_version: 12.3.rel1            # bookworm KDE image → gcc 12 / glibc 2.36
  image_url: https://github.com/radxa-build/radxa-zero3/releases/download/rsdk-b1/radxa-zero3_bookworm_kde_b1.output_512.img.xz
  cpu_flags: [-mcpu=cortex-a55]           # RK3566 (Cortex-A55)
  augment:
    - pkg: libdisplay-info
      min: "0.2.0"
      url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.2.0.tar.gz
      build: meson
      static: true
    - pkg: vulkan-headers
      min: "1.4.309"
      url: https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/vulkan-sdk-1.4.309.0.tar.gz
      build: cmake
      static: false
