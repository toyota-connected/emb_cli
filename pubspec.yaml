name: emb_cli
description: >-
  Flutter Embedder CLI: provision an embedded-Linux Flutter workspace and build
  ivi-homescreen bundles (cross-compiled AOT for arm64/riscv64).
version: 0.2.0
repository: https://github.com/toyota-connected/emb_cli
issue_tracker: https://github.com/toyota-connected/emb_cli/issues
topics:
  - flutter
  - embedded-linux
  - cross-compilation
  - cli
  - yocto

environment:
  sdk: ">=3.10.1 <4.0.0"

dependencies:
  args: ^2.5.0
  # macOS (Homebrew) host-provisioner backend. The three backends
  # (packagekit_dart/brew_dart/winget_dart) are all compiled into every build;
  # each one's native build hook no-ops off its own OS, and forHost() only
  # instantiates the matching backend at runtime. See lib/src/pkg/_platform/.
  brew_dart: ^0.3.0
  cli_completion: ^0.5.0
  crypto: ^3.0.0
  mason_logger: ">=0.2.16 <0.4.0"
  # Linux (PackageKit) host-provisioner backend.
  packagekit_dart: ^0.4.2
  path: ^1.9.0
  pub_semver: ^2.1.4
  pub_updater: ">=0.4.0 <0.6.0"
  # Windows (WinGet) host-provisioner backend.
  winget_dart: ^0.3.1
  yaml: ^3.1.0

dev_dependencies:
  build_runner: ^2.4.11
  build_verify: ^3.1.0
  build_version: ^2.1.1
  mocktail: ^1.0.4
  test: ^1.25.8
  very_good_analysis: ">=6.0.0 <11.0.0"

executables:
  emb:
