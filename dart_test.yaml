tags:
  # Shells out to the real git binary rather than a fake runner. Kept as a tag
  # so it can be excluded where git is unavailable; it runs by default.
  integration:
  version-verify:
    skip: "Should only be run during pull request. Verifies if version file is updated."
  # Needs flatpak-builder, an org.freedesktop.Platform/Sdk pair, and binutils
  # for readelf: the packager tests build a real bundle and the vendoring tests
  # read real ELF files. Opt-in with `dart test --run-skipped -t flatpak`. The
  # `flatpak` CI job installs all of it and asserts it is there before running,
  # because a test that skips itself reports green with no coverage.
  flatpak:
    skip: "Needs flatpak-builder, a runtime and readelf; -t flatpak to run."
